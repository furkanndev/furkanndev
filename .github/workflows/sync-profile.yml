name: Sync Profile Telemetry & Releases

on:
  schedule:
    # Run hourly to keep versions, releases, and repos permanently in sync
    - cron: "0 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-profile, release-published]
  push:
    branches:
      - main
    paths:
      - '.github/scripts/sync_profile.py'
      - '.github/workflows/sync-profile.yml'

permissions:
  contents: write

concurrency:
  group: sync-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Autonomous Profile Synchronizer
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Live Synchronizer Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/sync_profile.py README.md

      - name: Commit & Push Changes
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            echo "Changes detected in README.md. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(sync): auto-update releases, repos and telemetry [skip ci]"
            git push
          else
            echo "Profile README.md is already up to date. No commit needed."
          fi

