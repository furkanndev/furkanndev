<svg width="100%" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="auraVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0F" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>

    <radialGradient id="auraGoldGlow" cx="75%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#C9A24A" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auraCyanGlow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#4FE3FF" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#4FE3FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#4FE3FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="auraBrassText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" />
      <stop offset="45%" stop-color="#EBD79B" />
      <stop offset="80%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>

    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(237,232,223,0.03)" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .disp { font-family: 'Anton', 'Haettenschweiler', 'Arial Black', Impact, sans-serif; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Ambient Background -->
  <rect width="900" height="240" fill="url(#auraVoid)" />
  <rect width="900" height="240" fill="url(#auraGoldGlow)" />
  <rect width="900" height="240" fill="url(#auraCyanGlow)" />
  <rect width="900" height="240" fill="url(#cardGrid)" />

  <!-- Outer Hairline Border -->
  <rect x="12" y="12" width="876" height="216" fill="none" stroke="rgba(201,162,74,0.32)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 6 18 L 6 6 L 18 6" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 882 6 L 894 6 L 894 18" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 6 222 L 6 234 L 18 234" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 882 234 L 894 234 L 894 222" stroke="#C9A24A" stroke-width="2" fill="none" />

  <!-- KICKER -->
  <text x="32" y="38" class="mono" font-size="10.5" font-weight="600" fill="#C9A24A" letter-spacing="3">01 &bull; FLAGSHIP WORKSTATION &bull; OPEN SOURCE</text>

  <!-- BADGE -->
  <rect x="712" y="24" width="156" height="24" fill="rgba(255,79,163,0.06)" stroke="rgba(255,79,163,0.48)" stroke-width="1" />
  <text x="790" y="40" class="mono" font-size="10" font-weight="600" fill="#FF4FA3" text-anchor="middle" letter-spacing="2">RELEASE v2.2.3 PRO</text>

  <!-- TITLE -->
  <text x="32" y="78" class="disp" font-size="34" font-weight="900" fill="url(#auraBrassText)" letter-spacing="1.2">AuraPDF Pro</text>

  <!-- QUOTE -->
  <text x="210" y="74" class="sans" font-size="13.5" font-style="italic" fill="rgba(235,215,155,0.85)">
    &ldquo;Acrobat-grade precision without telemetry, subscriptions, or bloat.&rdquo;
  </text>

  <!-- BULLETS -->
  <text x="32" y="108" class="sans" font-size="13.5" fill="rgba(237,232,223,0.82)">
    <tspan fill="#C9A24A">&bull;</tspan> <tspan font-weight="600" fill="#EDE8DF">Direct On-Canvas Editing:</tspan> Select, mutate, re-font, and reflow text blocks directly on PDF pages in real time.
  </text>
  <text x="32" y="130" class="sans" font-size="13.5" fill="rgba(237,232,223,0.82)">
    <tspan fill="#C9A24A">&bull;</tspan> <tspan font-weight="600" fill="#EDE8DF">PyMuPDF C++ Engine &amp; OCR:</tspan> Low-latency rendering, sandwich OCR, AcroForms, and Word / Excel / PPTX export pipelines.
  </text>
  <text x="32" y="152" class="sans" font-size="13.5" fill="rgba(237,232,223,0.82)">
    <tspan fill="#C9A24A">&bull;</tspan> <tspan font-weight="600" fill="#EDE8DF">Production Windows Installer:</tspan> Automated build scripts producing standalone single-click <tspan class="mono" fill="#EBD79B">.exe</tspan> via Inno Setup 6.
  </text>

  <!-- DIVIDER -->
  <line x1="24" y1="172" x2="876" y2="172" stroke="rgba(201,162,74,0.22)" stroke-width="1" />

  <!-- TECH TAG PILLS -->
  <g transform="translate(32, 186)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="105" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="52" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">PYTHON 3.10+</text>

    <!-- Pill 2 -->
    <rect x="115" y="0" width="105" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="167" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">PYQT6 NATIVE</text>

    <!-- Pill 3 -->
    <rect x="230" y="0" width="115" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="287" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">PYMUPDF (C++)</text>

    <!-- Pill 4 -->
    <rect x="355" y="0" width="115" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="412" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">SANDWICH OCR</text>

    <!-- Pill 5 -->
    <rect x="480" y="0" width="110" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="535" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">INNO SETUP 6</text>

    <!-- Pill 6 -->
    <rect x="600" y="0" width="95" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="647" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">WIN 64-BIT</text>

    <!-- Link indicator -->
    <text x="836" y="15" class="mono" font-size="10" font-weight="600" fill="#C9A24A" text-anchor="end" letter-spacing="2">VIEW REPOSITORY &rarr;</text>
  </g>
</svg>
