<svg width="100%" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keyVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0F" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>

    <radialGradient id="keyGoldGlow" cx="20%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#C9A24A" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="keyPinkGlow" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#FF4FA3" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#FF4FA3" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FF4FA3" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="keyBrassText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" />
      <stop offset="45%" stop-color="#EBD79B" />
      <stop offset="80%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>

    <pattern id="keyGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(237,232,223,0.03)" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .disp { font-family: 'Anton', 'Haettenschweiler', 'Arial Black', Impact, sans-serif; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Ambient Background -->
  <rect width="900" height="240" fill="url(#keyVoid)" />
  <rect width="900" height="240" fill="url(#keyGoldGlow)" />
  <rect width="900" height="240" fill="url(#keyPinkGlow)" />
  <rect width="900" height="240" fill="url(#keyGrid)" />

  <!-- Outer Hairline Border -->
  <rect x="12" y="12" width="876" height="216" fill="none" stroke="rgba(201,162,74,0.32)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 6 18 L 6 6 L 18 6" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 882 6 L 894 6 L 894 18" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 6 222 L 6 234 L 18 234" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 882 234 L 894 234 L 894 222" stroke="#C9A24A" stroke-width="2" fill="none" />

  <!-- KICKER -->
  <text x="32" y="38" class="mono" font-size="10.5" font-weight="600" fill="#C9A24A" letter-spacing="3">02 &bull; WORKSTATION SETUP &bull; WIN32 ARCHITECTURE</text>

  <!-- BADGE -->
  <rect x="724" y="24" width="144" height="24" fill="rgba(79,227,255,0.06)" stroke="rgba(79,227,255,0.48)" stroke-width="1" />
  <text x="796" y="40" class="mono" font-size="10" font-weight="600" fill="#4FE3FF" text-anchor="middle" letter-spacing="2">VERSION 1.0 &bull; STABLE</text>

  <!-- TITLE -->
  <text x="32" y="78" class="disp" font-size="34" font-weight="900" fill="url(#keyBrassText)" letter-spacing="1.2">Keystone</text>

  <!-- QUOTE -->
  <text x="180" y="74" class="sans" font-size="13.5" font-style="italic" fill="rgba(235,215,155,0.85)">
    &ldquo;Zero-friction workstation onboarding for fresh Windows 10 &amp; 11 environments.&rdquo;
  </text>

  <!-- BULLETS -->
  <text x="32" y="108" class="sans" font-size="13.5" fill="rgba(237,232,223,0.82)">
    <tspan fill="#C9A24A">&bull;</tspan> <tspan font-weight="600" fill="#EDE8DF">140+ Silent Deployments:</tspan> Automated silent package retrieval across runtimes, dev tools &amp; browsers via Winget.
  </text>
  <text x="32" y="130" class="sans" font-size="13.5" fill="rgba(237,232,223,0.82)">
    <tspan fill="#C9A24A">&bull;</tspan> <tspan font-weight="600" fill="#EDE8DF">Win32 Registry Optimizer:</tspan> Real-time state detection (HKCU/HKLM), telemetry removal, and 1-click rollback engine.
  </text>
  <text x="32" y="152" class="sans" font-size="13.5" fill="rgba(237,232,223,0.82)">
    <tspan fill="#C9A24A">&bull;</tspan> <tspan font-weight="600" fill="#EDE8DF">Full Migration Pipelines:</tspan> One-click backup &amp; restoration for browser bookmarks, Wi-Fi keys, SSH, Git &amp; VS Code.
  </text>

  <!-- DIVIDER -->
  <line x1="24" y1="172" x2="876" y2="172" stroke="rgba(201,162,74,0.22)" stroke-width="1" />

  <!-- TECH TAG PILLS -->
  <g transform="translate(32, 186)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="105" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="52" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">PYTHON 3.11+</text>

    <!-- Pill 2 -->
    <rect x="115" y="0" width="105" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="167" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">PYQT6 NATIVE</text>

    <!-- Pill 3 -->
    <rect x="230" y="0" width="100" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="280" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">WIN32 API</text>

    <!-- Pill 4 -->
    <rect x="340" y="0" width="115" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="397" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">WINGET ENGINE</text>

    <!-- Pill 5 -->
    <rect x="465" y="0" width="125" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="527" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">REGISTRY TWEAKS</text>

    <!-- Pill 6 -->
    <rect x="600" y="0" width="95" height="22" fill="rgba(201,162,74,0.06)" stroke="rgba(201,162,74,0.35)" />
    <text x="647" y="15" class="mono" font-size="9.5" fill="#EBD79B" text-anchor="middle" letter-spacing="1">PYINSTALLER</text>

    <!-- Link indicator -->
    <text x="836" y="15" class="mono" font-size="10" font-weight="600" fill="#C9A24A" text-anchor="end" letter-spacing="2">VIEW REPOSITORY &rarr;</text>
  </g>
</svg>
