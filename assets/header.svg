<svg width="100%" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Void Gradients -->
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A" />
      <stop offset="50%" stop-color="#0C0C10" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Metallic Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" />
      <stop offset="35%" stop-color="#F5E4B3" />
      <stop offset="70%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#A27D2C" />
    </linearGradient>

    <!-- Subtle Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#C9A24A" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </radialGradient>

    <!-- CRT Fine Grid Pattern -->
    <pattern id="crtGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(237,232,223,0.035)" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace;
    }
    .head {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
    }
  </style>

  <!-- Deep Obsidian Void Background -->
  <rect width="900" height="260" fill="url(#voidGrad)" />
  <rect width="900" height="260" fill="url(#amberGlow)" />
  <rect width="900" height="260" fill="url(#crtGrid)" />

  <!-- Outer Brass Hairline Border -->
  <rect x="14" y="14" width="872" height="232" fill="none" stroke="rgba(201,162,74,0.38)" stroke-width="1.2" />

  <!-- Technical Corner Brackets -->
  <path d="M 8 24 L 8 8 L 24 8" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 876 8 L 892 8 L 892 24" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 8 236 L 8 252 L 24 252" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 876 252 L 892 252 L 892 236" stroke="#C9A24A" stroke-width="2.5" fill="none" />

  <!-- Corner Rivets -->
  <circle cx="24" cy="24" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="876" cy="24" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="24" cy="236" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="876" cy="236" r="2.5" fill="#EBD79B" opacity="0.9" />

  <!-- TOP STATUS BAR -->
  <text x="36" y="38" class="mono" font-size="11.5" font-weight="700" fill="#EBD79B" letter-spacing="2">
    FURKAN GÜLTEKİN <tspan fill="rgba(237,232,223,0.5)" font-weight="400">&mdash; SOFTWARE DEVELOPER &amp; DESKTOP ARCHITECT</tspan>
  </text>

  <!-- Live On-Air Broadcast Indicator Bug (Right-Anchored) -->
  <circle cx="682" cy="34" r="4.5" fill="#FF3B30" />
  <circle cx="682" cy="34" r="8" fill="#FF3B30" opacity="0.25" />
  <text x="864" y="38" class="mono" font-size="10.5" font-weight="700" fill="#EBD79B" text-anchor="end" letter-spacing="2">
    CH 01 · BROADCAST ACTIVE
  </text>

  <!-- Horizontal Divider Line -->
  <line x1="26" y1="52" x2="874" y2="52" stroke="rgba(201,162,74,0.3)" stroke-width="1" />

  <!-- HERO EDITORIAL HEADLINE -->
  <text x="36" y="102" class="head" font-size="28" fill="#EDE8DF" letter-spacing="0.5">
    I BUILD HIGH-PERFORMANCE DESKTOP WORKSTATIONS
  </text>
  <text x="36" y="148" class="head" font-size="40" fill="url(#brassGrad)" letter-spacing="1.5">
    THAT ACTUALLY WORK.
  </text>

  <!-- Sub-Divider Line -->
  <line x1="26" y1="172" x2="874" y2="172" stroke="rgba(237,232,223,0.14)" stroke-width="1" />

  <!-- REPOSITORY HIGHLIGHT STRIP -->
  <text x="36" y="196" class="mono" font-size="12" font-weight="500" fill="rgba(237,232,223,0.85)" letter-spacing="1">
    <tspan fill="#F5E4B3" font-weight="700">FLAGSHIPS:</tspan> AuraPDF Pro · Keystone <tspan fill="#C9A24A">|</tspan> Social-Saver · Linux inotify Daemon · C++17 Engines
  </text>

  <!-- BOTTOM STATUS RAIL (Divided & Right-Anchored) -->
  <line x1="26" y1="216" x2="874" y2="216" stroke="rgba(201,162,74,0.25)" stroke-width="1" />

  <text x="36" y="235" class="mono" font-size="11" font-weight="700" fill="#EBD79B" letter-spacing="1.8">
    10 REPOSITORIES · 2 PRODUCTION FLAGSHIPS · WIN64 / LINUX
  </text>

  <text x="864" y="235" class="mono" font-size="11" font-weight="500" fill="rgba(237,232,223,0.6)" text-anchor="end" letter-spacing="1.5">
    C++17 · C# .NET · PYTHON 3.11 · WIN32
  </text>
</svg>
