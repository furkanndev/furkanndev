<svg width="100%" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A" />
      <stop offset="45%" stop-color="#0C0C10" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" />
      <stop offset="35%" stop-color="#F5E4B3" />
      <stop offset="70%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>

    <!-- Subtle Amber Ambient Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#C9A24A" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </radialGradient>

    <!-- CRT Fine Grid Pattern -->
    <pattern id="crtGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(237,232,223,0.035)" stroke-width="0.75" />
    </pattern>

    <!-- Broadcast Indicator Glow -->
    <filter id="recGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF3B30" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .disp {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Deep Obsidian Void Background -->
  <rect width="900" height="320" fill="url(#voidGrad)" />
  <rect width="900" height="320" fill="url(#amberGlow)" />
  <rect width="900" height="320" fill="url(#crtGrid)" />

  <!-- Outer Brass Hairline Border -->
  <rect x="12" y="12" width="876" height="296" fill="none" stroke="rgba(201,162,74,0.36)" stroke-width="1.2" />

  <!-- Technical Corner Brackets -->
  <path d="M 6 22 L 6 6 L 22 6" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 878 6 L 894 6 L 894 22" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 6 298 L 6 314 L 22 314" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 878 314 L 894 314 L 894 298" stroke="#C9A24A" stroke-width="2.5" fill="none" />

  <!-- Corner Rivet Accents -->
  <circle cx="22" cy="22" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="878" cy="22" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="22" cy="298" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="878" cy="298" r="2.5" fill="#EBD79B" opacity="0.9" />

  <!-- TOP HEADER RAIL -->
  <text x="32" y="38" class="mono" font-size="11.5" font-weight="600" fill="#C9A24A" letter-spacing="2.5">FURKAN GÜLTEKİN</text>
  <text x="186" y="38" class="mono" font-size="11" font-weight="400" fill="rgba(237,232,223,0.5)" letter-spacing="2">&mdash; SOFTWARE DEVELOPER &amp; DESKTOP ARCHITECT</text>

  <!-- Live On-Air Broadcast Indicator Bug -->
  <circle cx="698" cy="34" r="4.5" fill="#FF3B30" filter="url(#recGlow)" />
  <text x="712" y="38" class="mono" font-size="10.5" font-weight="600" fill="#EBD79B" letter-spacing="2.2">CH 01 · BROADCAST ACTIVE</text>

  <!-- Top Divider Line -->
  <line x1="24" y1="52" x2="876" y2="52" stroke="rgba(201,162,74,0.3)" stroke-width="1" />

  <!-- EDITORIAL DISPLAY HEADLINE (selma.codes authentic sentence-case voice) -->
  <text x="32" y="96" class="disp" font-size="34" fill="#EDE8DF" letter-spacing="-0.5">I build</text>
  <text x="32" y="140" class="disp" font-size="34" fill="#EDE8DF" letter-spacing="-0.5">desktop workstations &amp; systems that</text>
  <text x="32" y="190" class="disp" font-size="44" fill="url(#brassGrad)" letter-spacing="1">actually work.</text>

  <!-- LEDE SUMMARY PARAGRAPH -->
  <text x="32" y="228" class="sans" font-size="14" fill="rgba(237,232,223,0.85)" letter-spacing="0.2">
    High-performance native desktop platforms, background daemon services, reverse-engineered network
  </text>
  <text x="32" y="248" class="sans" font-size="14" fill="rgba(237,232,223,0.85)" letter-spacing="0.2">
    pipelines, and workstation automation. Creator of AuraPDF Pro &amp; Keystone.
  </text>

  <!-- Sub-Divider Line -->
  <line x1="24" y1="272" x2="876" y2="272" stroke="rgba(237,232,223,0.14)" stroke-width="1" />

  <!-- BOTTOM STATUS RAIL -->
  <text x="32" y="295" class="mono" font-size="11" font-weight="600" fill="#EBD79B" letter-spacing="2">
    10 REPOSITORIES · 2 PRODUCTION FLAGSHIPS
  </text>

  <text x="440" y="295" class="mono" font-size="11" font-weight="500" fill="rgba(237,232,223,0.6)" letter-spacing="1.5">
    STACK: C++17 · C# / .NET · PYTHON 3.11 · WIN32 · LINUX
  </text>
</svg>
