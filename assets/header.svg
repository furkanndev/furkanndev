<svg width="100%" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Void Linear Base -->
    <linearGradient id="voidBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0F" />
      <stop offset="42%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#0A0A0E" />
    </linearGradient>

    <!-- Aurora Gradients matching selma.codes #bg -->
    <radialGradient id="auroraGold" cx="68%" cy="6%" r="65%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#C9A24A" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraPink" cx="8%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#FF4FA3" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#FF4FA3" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FF4FA3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraCyan" cx="94%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#4FE3FF" stop-opacity="0.12" />
      <stop offset="65%" stop-color="#4FE3FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#4FE3FF" stop-opacity="0" />
    </radialGradient>

    <!-- Brass Gradient for Display Type -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" />
      <stop offset="40%" stop-color="#EBD79B" />
      <stop offset="75%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="rgba(237,232,223,0.035)" stroke-width="0.75" />
    </pattern>

    <!-- Glowing Bug Indicator -->
    <filter id="glowBug" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF3B30" flood-opacity="0.9" />
    </filter>

    <!-- Brass Glow Filter -->
    <filter id="brassTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C9A24A" flood-opacity="0.32" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .disp { font-family: 'Anton', 'Haettenschweiler', 'Arial Black', Impact, sans-serif; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Void & Ambient Auroras -->
  <rect width="900" height="280" fill="url(#voidBase)" />
  <rect width="900" height="280" fill="url(#auroraGold)" />
  <rect width="900" height="280" fill="url(#auroraPink)" />
  <rect width="900" height="280" fill="url(#auroraCyan)" />
  <rect width="900" height="280" fill="url(#grid)" />

  <!-- Outer Brass Hairline Border -->
  <rect x="14" y="14" width="872" height="252" fill="none" stroke="rgba(201,162,74,0.30)" stroke-width="1" />

  <!-- Technical Corner Brackets -->
  <path d="M 8 22 L 8 8 L 22 8" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 878 8 L 892 8 L 892 22" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 8 258 L 8 272 L 22 272" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 878 272 L 892 272 L 892 258" stroke="#C9A24A" stroke-width="2" fill="none" />

  <!-- Fasteners / Screws -->
  <circle cx="24" cy="24" r="2.5" fill="#C9A24A" opacity="0.75" />
  <circle cx="876" cy="24" r="2.5" fill="#C9A24A" opacity="0.75" />
  <circle cx="24" cy="256" r="2.5" fill="#C9A24A" opacity="0.75" />
  <circle cx="876" cy="256" r="2.5" fill="#C9A24A" opacity="0.75" />

  <!-- TOP STATUS BAR -->
  <text x="36" y="38" class="mono" font-size="11" font-weight="600" fill="#EBD79B" letter-spacing="2.6">FURKAN GÜLTEKİN</text>
  <text x="180" y="38" class="mono" font-size="10" font-weight="400" fill="rgba(237,232,223,0.44)" letter-spacing="2">/ SOFTWARE DEVELOPER &amp; SYSTEMS ARCHITECT</text>

  <!-- Live On-Air Broadcast Bug -->
  <circle cx="698" cy="34" r="4.5" fill="#FF3B30" filter="url(#glowBug)" />
  <text x="710" y="38" class="mono" font-size="9.5" font-weight="600" fill="#EBD79B" letter-spacing="2.2">CH 01 · SYSTEM BROADCAST</text>

  <!-- Divider Line -->
  <line x1="28" y1="52" x2="872" y2="52" stroke="rgba(201,162,74,0.28)" stroke-width="1" />

  <!-- KICKER -->
  <text x="36" y="78" class="mono" font-size="10.5" font-weight="500" fill="#C9A24A" letter-spacing="3.2">DISPATCH &bull; PRODUCTION WORKSTATIONS &bull; SAKARYA, TR</text>

  <!-- HERO EDITORIAL DISPLAY HEADLINES -->
  <text x="36" y="118" class="disp" font-size="32" font-weight="900" fill="#EDE8DF" letter-spacing="1">I BUILD HIGH-PERFORMANCE DESKTOP WORKSTATIONS</text>
  <text x="36" y="162" class="disp" font-size="40" font-weight="900" fill="url(#brassGrad)" letter-spacing="1.8" filter="url(#brassTextGlow)">THAT ACTUALLY WORK.</text>

  <!-- Subtitle Lede -->
  <text x="36" y="194" class="sans" font-size="14.5" fill="rgba(237,232,223,0.72)">
    Desktop Architecture (Qt/PyQt6, C#/.NET, Modern C++) &bull; Win32 API &bull; Linux Systemd Daemons &bull; Reverse Engineering
  </text>
  <text x="36" y="214" class="sans" font-size="14" fill="rgba(237,232,223,0.50)">
    Maintainer of AuraPDF Pro &amp; Keystone. Building native, low-latency applications with zero electron/webview bloat.
  </text>

  <!-- BOTTOM STATS STRIP -->
  <line x1="28" y1="234" x2="872" y2="234" stroke="rgba(201,162,74,0.22)" stroke-width="1" />

  <text x="36" y="254" class="mono" font-size="10" font-weight="500" fill="#C9A24A" letter-spacing="2">
    10 REPOSITORIES &bull; 2 FLAGSHIP WORKSTATIONS &bull; SAKARYA UNIVERSITY B.S.
  </text>

  <text x="590" y="254" class="mono" font-size="9.5" font-weight="500" fill="rgba(237,232,223,0.48)" letter-spacing="1.8">
    STACK: PYQT6 &bull; C++17 &bull; C# .NET &bull; WIN32
  </text>
</svg>
