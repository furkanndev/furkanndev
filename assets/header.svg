<svg width="100%" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A" />
      <stop offset="50%" stop-color="#0C0C10" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Brass Gradient for Main Accent Headline -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" />
      <stop offset="40%" stop-color="#F5E4B3" />
      <stop offset="80%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#A27D2C" />
    </linearGradient>

    <!-- Subtle Amber Radiance -->
    <radialGradient id="amberGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#C9A24A" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </radialGradient>

    <!-- CRT Fine Grid Pattern -->
    <pattern id="crtGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(237,232,223,0.04)" stroke-width="0.75" />
    </pattern>

    <!-- Drop Shadow for Red Live Broadcast Dot -->
    <filter id="recGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF3B30" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    .head {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Deep Obsidian Void Background -->
  <rect width="900" height="260" fill="url(#voidGrad)" />
  <rect width="900" height="260" fill="url(#amberGlow)" />
  <rect width="900" height="260" fill="url(#crtGrid)" />

  <!-- Outer Brass Hairline Border -->
  <rect x="14" y="14" width="872" height="232" fill="none" stroke="rgba(201,162,74,0.4)" stroke-width="1.2" />

  <!-- Technical Corner Brackets -->
  <path d="M 8 24 L 8 8 L 24 8" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 876 8 L 892 8 L 892 24" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 8 236 L 8 252 L 24 252" stroke="#C9A24A" stroke-width="2.5" fill="none" />
  <path d="M 876 252 L 892 252 L 892 236" stroke="#C9A24A" stroke-width="2.5" fill="none" />

  <!-- Corner Rivet Accents -->
  <circle cx="24" cy="24" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="876" cy="24" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="24" cy="236" r="2.5" fill="#EBD79B" opacity="0.9" />
  <circle cx="876" cy="236" r="2.5" fill="#EBD79B" opacity="0.9" />

  <!-- TOP STATUS BAR -->
  <text x="36" y="40" class="mono" font-size="13" font-weight="700" fill="#F5E4B3" letter-spacing="2.5">FURKAN GÜLTEKİN</text>
  <text x="210" y="40" class="mono" font-size="12" font-weight="500" fill="rgba(237,232,223,0.7)" letter-spacing="1.8">/ SOFTWARE DEVELOPER &amp; DESKTOP ARCHITECT</text>

  <!-- Live On-Air Broadcast Indicator Bug -->
  <circle cx="682" cy="36" r="5" fill="#FF3B30" filter="url(#recGlow)" />
  <text x="696" y="40" class="mono" font-size="12" font-weight="700" fill="#EBD79B" letter-spacing="2">CH 01 · BROADCAST ACTIVE</text>

  <!-- Horizontal Divider Line -->
  <line x1="28" y1="56" x2="872" y2="56" stroke="rgba(201,162,74,0.35)" stroke-width="1" />

  <!-- HERO EDITORIAL HEADLINE (High Contrast, Bold, Large) -->
  <text x="36" y="104" class="head" font-size="28" fill="#EDE8DF" letter-spacing="1">I BUILD HIGH-PERFORMANCE DESKTOP WORKSTATIONS</text>
  <text x="36" y="148" class="head" font-size="38" fill="url(#brassGrad)" letter-spacing="2">THAT ACTUALLY WORK.</text>

  <!-- Sub-Divider Line -->
  <line x1="28" y1="172" x2="872" y2="172" stroke="rgba(201,162,74,0.25)" stroke-width="1" />

  <!-- REPOSITORY HIGHLIGHT STRIP (High Contrast, Crisp & Legible) -->
  <text x="36" y="198" class="mono" font-size="13.5" font-weight="500" fill="#FFFFFF" letter-spacing="1.2">
    <tspan fill="#F5E4B3" font-weight="700">FLAGSHIPS:</tspan> AuraPDF Pro · Keystone <tspan fill="#C9A24A">|</tspan> Social-Saver · Linux inotify Daemon · C++17 Engines
  </text>

  <!-- BOTTOM METRIC STRIP -->
  <line x1="28" y1="216" x2="872" y2="216" stroke="rgba(201,162,74,0.3)" stroke-width="1" />

  <text x="36" y="236" class="mono" font-size="12" font-weight="700" fill="#F5E4B3" letter-spacing="1.8">
    10 REPOSITORIES · 2 PRODUCTION FLAGSHIPS · WIN64 / LINUX
  </text>

  <text x="560" y="236" class="mono" font-size="12" font-weight="500" fill="rgba(237,232,223,0.8)" letter-spacing="1.8">
    C++17 · C# .NET · PYTHON 3.11 · WIN32
  </text>
</svg>
