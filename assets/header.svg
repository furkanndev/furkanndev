<svg width="100%" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A" />
      <stop offset="45%" stop-color="#0B0B0F" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24A" />
      <stop offset="35%" stop-color="#EBD79B" />
      <stop offset="70%" stop-color="#C9A24A" />
      <stop offset="100%" stop-color="#A27D2C" />
    </linearGradient>

    <!-- Subtle Radial Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C9A24A" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#C9A24A" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#C9A24A" stop-opacity="0" />
    </radialGradient>

    <!-- CRT Fine Grid Pattern -->
    <pattern id="crtGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(237,232,223,0.03)" stroke-width="0.75" />
    </pattern>

    <!-- Drop Shadow for Red Recording Bug -->
    <filter id="recGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF3B30" flood-opacity="0.85" />
    </filter>

    <!-- Brass Glow Filter -->
    <filter id="brassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#C9A24A" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'IBM Plex Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    }
    .disp {
      font-family: 'Anton', 'Haettenschweiler', 'Arial Black', Impact, sans-serif;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Deep Obsidian Void Background -->
  <rect width="900" height="260" fill="url(#voidGrad)" />
  <rect width="900" height="260" fill="url(#amberGlow)" />
  <rect width="900" height="260" fill="url(#crtGrid)" />

  <!-- Outer Brass Hairline Border -->
  <rect x="14" y="14" width="872" height="232" fill="none" stroke="rgba(201,162,74,0.32)" stroke-width="1" />

  <!-- Technical Corner Brackets -->
  <path d="M 8 22 L 8 8 L 22 8" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 878 8 L 892 8 L 892 22" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 8 238 L 8 252 L 22 252" stroke="#C9A24A" stroke-width="2" fill="none" />
  <path d="M 878 252 L 892 252 L 892 238" stroke="#C9A24A" stroke-width="2" fill="none" />

  <!-- Corner Rivets / Fasteners -->
  <circle cx="24" cy="24" r="2.5" fill="#C9A24A" opacity="0.8" />
  <circle cx="876" cy="24" r="2.5" fill="#C9A24A" opacity="0.8" />
  <circle cx="24" cy="236" r="2.5" fill="#C9A24A" opacity="0.8" />
  <circle cx="876" cy="236" r="2.5" fill="#C9A24A" opacity="0.8" />

  <!-- TOP STATUS BAR -->
  <text x="36" y="38" class="mono" font-size="11" font-weight="600" fill="#EBD79B" letter-spacing="2.5">FURKAN GÜLTEKİN</text>
  <text x="180" y="38" class="mono" font-size="10" font-weight="400" fill="rgba(237,232,223,0.44)" letter-spacing="2">/ SOFTWARE DEVELOPER &amp; SYSTEMS ARCHITECT</text>

  <!-- Live On-Air Broadcast Bug -->
  <circle cx="704" cy="34" r="4.5" fill="#FF3B30" filter="url(#recGlow)" />
  <text x="716" y="38" class="mono" font-size="9.5" font-weight="600" fill="#EBD79B" letter-spacing="2.2">CH 01 · SYSTEM BROADCAST</text>

  <!-- Horizontal Divider Line -->
  <line x1="28" y1="52" x2="872" y2="52" stroke="rgba(201,162,74,0.28)" stroke-width="1" />

  <!-- HERO EDITORIAL HEADLINE -->
  <text x="36" y="102" class="disp" font-size="30" font-weight="900" fill="#EDE8DF" letter-spacing="1.2">I BUILD HIGH-PERFORMANCE DESKTOP WORKSTATIONS</text>
  <text x="36" y="146" class="disp" font-size="38" font-weight="900" fill="url(#brassGrad)" letter-spacing="1.8" filter="url(#brassGlow)">THAT ACTUALLY WORK.</text>

  <!-- Sub-Divider Line -->
  <line x1="28" y1="172" x2="872" y2="172" stroke="rgba(237,232,223,0.12)" stroke-width="1" />

  <!-- REPOSITORY HIGHLIGHT STRING -->
  <text x="36" y="196" class="mono" font-size="11.5" font-weight="400" fill="rgba(237,232,223,0.72)" letter-spacing="1.4">
    <tspan fill="#C9A24A" font-weight="600">FLAGSHIP:</tspan> AuraPDF Pro · Keystone <tspan fill="rgba(201,162,74,0.5)">|</tspan> Social-Saver · NavalStrike · DirectoryChangeMonitor · Low-Level Systems
  </text>

  <!-- BOTTOM METRIC STRIP -->
  <line x1="28" y1="216" x2="872" y2="216" stroke="rgba(201,162,74,0.22)" stroke-width="1" />

  <text x="36" y="234" class="mono" font-size="9.5" font-weight="500" fill="#C9A24A" letter-spacing="2">
    LOC: SAKARYA, TR · SAKARYA UNIVERSITY B.S.
  </text>

  <text x="540" y="234" class="mono" font-size="9.5" font-weight="500" fill="rgba(237,232,223,0.48)" letter-spacing="2">
    10 REPOSITORIES · WIN64 / LINUX · C++ / C# / PYTHON
  </text>
</svg>
